services:
  - type: web
    name: film-ai-platform-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: film-ai-platform-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: film-ai-platform-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: film-ai-platform-redis
          type: redis
          property: connectionString
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: AI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: worker
    name: film-ai-platform-worker
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A celery_worker.celery worker --loglevel=INFO --concurrency=2
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: film-ai-platform-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: film-ai-platform-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: film-ai-platform-redis
          type: redis
          property: connectionString
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: AI_API_KEY
        sync: false

  - type: redis
    name: film-ai-platform-redis
    ipAllowList: []

databases:
  - name: film-ai-platform-db
    plan: starter
